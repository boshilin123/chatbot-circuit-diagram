spring:
  application:
    name: chatbot

# 服务器配置
server:
  port: ${PORT:8080}

# DeepSeek API 配置
# API Key 必须通过环境变量提供，禁止提交真实密钥到仓库。
deepseek:
  api:
    key: ${DEEPSEEK_API_KEY}
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}

# 日志配置
logging:
  level:
    root: INFO
    com.bo.chatbot: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
