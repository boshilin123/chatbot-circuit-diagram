[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-circuit-diagram"
version = "0.3.0"
description = "LangChain + LangGraph + Hybrid RAG vehicle circuit diagram retrieval agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langchain-deepseek>=1.1,<2.0",
    "langchain-huggingface>=1.2,<2.0",
    "langchain-milvus>=0.4,<0.5",
    "sentence-transformers>=5.0,<6.0",
    "pydantic-settings>=2.6,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
